name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Dev tooling only. shellmate itself has no runtime dependencies —
      # the no-dependencies job below is what guards that.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest ruff

      - run: ruff check shellmate/ tests/
      - run: ruff format --check shellmate/ tests/
      - run: python -m pytest -q

      # The shell scripts are where every real bug in this project has lived,
      # so check syntax AND actually run them. `sh -n` alone would not have
      # caught `stat -c` being GNU-only, which broke every macOS user.
      - run: sh -n install.sh
      - run: sh -n hooks/claude-session-state.sh
      - run: sh -n statusline/shellmate-sprite.sh

      - name: Hook records session state
        run: |
          echo '{"hook_event_name":"UserPromptSubmit","session_id":"ci-1","cwd":"/tmp/x"}' \
            | sh hooks/claude-session-state.sh
          f="${XDG_STATE_HOME:-$HOME/.local/state}/shellmate/sessions/ci-1.json"
          test -f "$f" || { echo "hook wrote no session file"; exit 1; }
          grep -q working "$f" || { echo "hook did not record working"; exit 1; }
          echo '{"hook_event_name":"Stop","session_id":"ci-1","cwd":"/tmp/x"}' \
            | sh hooks/claude-session-state.sh
          grep -q done "$f" || { echo "hook did not record done"; exit 1; }

      - name: Sprite script renders
        run: |
          SHELLMATE_HOME=$PWD sh statusline/shellmate-sprite.sh >/dev/null 2>&1 || true
          sleep 4
          out=$(SHELLMATE_HOME=$PWD sh statusline/shellmate-sprite.sh 2>/dev/null)
          if [ -z "$out" ]; then
            echo "sprite produced no output"
            echo "--- cache dir ---"
            ls -la "${XDG_RUNTIME_DIR:-/tmp}/shellmate" 2>&1 || true
            exit 1
          fi
          printf '%s\n' "$out"

      - name: CLI entry points
        run: |
          python -m shellmate --whoami
          python -m shellmate --all > /dev/null
          python -m shellmate --pet

  no-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Package must import on a bare interpreter
        run: |
          python -c "import shellmate.app, shellmate.render, shellmate.session, shellmate.characters"
          python -m shellmate --all > /dev/null
