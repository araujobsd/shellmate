name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Dev tooling only. shellmate itself has no runtime dependencies —
      # the no-dependencies job below is what guards that.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest "ruff==0.15.11"  # pinned: format rules shift between minors

      - run: ruff check shellmate/ tests/
      - run: ruff format --check shellmate/ tests/
      - run: python -m pytest -q

      # The shell scripts are where every real bug in this project has lived,
      # so check syntax AND actually run them. `sh -n` alone would not have
      # caught `stat -c` being GNU-only, which broke every macOS user.
      - run: sh -n install.sh
      - run: sh -n hooks/claude-session-state.sh
      - run: sh -n statusline/shellmate-sprite.sh

      - name: Hook records session state
        run: |
          echo '{"hook_event_name":"UserPromptSubmit","session_id":"ci-1","cwd":"/tmp/x"}' \
            | sh hooks/claude-session-state.sh
          f="${XDG_STATE_HOME:-$HOME/.local/state}/shellmate/sessions/ci-1.json"
          test -f "$f" || { echo "hook wrote no session file"; exit 1; }
          grep -q working "$f" || { echo "hook did not record working"; exit 1; }
          echo '{"hook_event_name":"Stop","session_id":"ci-1","cwd":"/tmp/x"}' \
            | sh hooks/claude-session-state.sh
          grep -q done "$f" || { echo "hook did not record done"; exit 1; }

      - name: Sprite script renders
        run: |
          # Start from an empty cache. A previous version of this step asserted
          # only that the script produced output, which it happily did from
          # frames cached before a rename — so the cold path crashed on every
          # run, no frames were ever written, the buddy never rendered, and CI
          # stayed green. Clearing first is what makes this test mean anything.
          cache="${XDG_RUNTIME_DIR:-/tmp}/shellmate"
          rm -rf "$cache"

          # First call warms the cache via the backgrounded cold path.
          SHELLMATE_HOME=$PWD sh statusline/shellmate-sprite.sh >/dev/null 2>&1 || true
          sleep 5

          # The cold path must have WRITTEN frames, not merely exited 0.
          if [ ! -d "$cache" ] || [ -z "$(find "$cache" -name 'frame*' -print -quit)" ]; then
            echo "cold path wrote no frames — it is failing silently"
            echo "--- cache tree ---"; ls -laR "$cache" 2>&1 || true
            echo "--- cold path with stderr shown ---"
            sed 's|2>/dev/null||; s|) >/dev/null 2>&1 &|)|' statusline/shellmate-sprite.sh > /tmp/sprite-debug.sh
            SHELLMATE_HOME=$PWD sh /tmp/sprite-debug.sh 2>&1 | tail -30
            exit 1
          fi

          out=$(SHELLMATE_HOME=$PWD sh statusline/shellmate-sprite.sh 2>/dev/null)
          if [ -z "$out" ]; then
            echo "sprite produced no output despite cached frames"
            ls -laR "$cache" 2>&1 || true
            exit 1
          fi
          printf '%s\n' "$out"

          # A per-session cache must be written too — the status line always
          # passes SHELLMATE_SESSION_ID, so the aggregate path alone is not
          # evidence that real usage works.
          rm -rf "$cache"
          SHELLMATE_HOME=$PWD SHELLMATE_SESSION_ID=ci-session sh statusline/shellmate-sprite.sh >/dev/null 2>&1 || true
          sleep 5
          if [ -z "$(find "$cache" -path '*ci-session*' -name 'frame*' -print -quit)" ]; then
            echo "per-session cold path wrote no frames"
            ls -laR "$cache" 2>&1 || true
            exit 1
          fi
          out=$(SHELLMATE_HOME=$PWD SHELLMATE_SESSION_ID=ci-session sh statusline/shellmate-sprite.sh 2>/dev/null)
          test -n "$out" || { echo "per-session render produced no output"; exit 1; }
          printf '%s\n' "$out"

      - name: CLI entry points
        run: |
          python -m shellmate --whoami
          python -m shellmate --all > /dev/null
          python -m shellmate --pet

  no-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Package must import on a bare interpreter
        run: |
          python -c "import shellmate.app, shellmate.render, shellmate.session, shellmate.characters"
          python -m shellmate --all > /dev/null
